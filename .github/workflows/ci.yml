name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kitawisata
          POSTGRES_PASSWORD: kitawisata
          POSTGRES_DB: kitawisata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kitawisata" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kitawisata:kitawisata@localhost:5432/kitawisata?schema=public
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm build
