<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<title>kitawisata Business Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --red:#CC2423; --red-d:#9A1B1B; --red-t:#FBE9E8; --gold:#F2B632;
  --ink:#231F20; --muted:#6B5F5C; --line:#E8E2E0; --line2:#D6CECB;
  --ground:#F8F6F5; --green:#1C7C54; --green-d:#155E40; --green-t:#E3F2EA;
  --amber:#7A5200; --amber-t:#FDF3DC; --blue-t:#E8EEF6; --blue:#2D4F7C;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;border:none;font-weight:700;font-size:14.5px;white-space:nowrap}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-d)}
.btn-line{background:#fff;border:1px solid var(--line2);color:var(--ink)}.btn-line:hover{border-color:var(--ink)}
.btn-green{background:var(--green);color:#fff}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.pad{padding:20px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-green{background:var(--green-t);color:var(--green-d)}.b-amber{background:var(--amber-t);color:var(--amber)}
.b-red{background:var(--red-t);color:var(--red-d)}.b-grey{background:#EFEAE8;color:var(--muted)}.b-blue{background:var(--blue-t);color:var(--blue)}.b-ink{background:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{min-height:46px;border:1px solid var(--line2);border-radius:11px;padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);background:#FCFBFA;text-transform:none;letter-spacing:0;width:100%}
.field textarea{padding:10px 12px;min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px var(--red-t)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:11px;background:#fff;font-weight:600;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--red)}
.ck.off{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:980px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:16px}

/* shell */
.demo{background:var(--amber-t);color:var(--amber);font-size:12.5px;font-weight:600;text-align:center;padding:7px 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;min-height:66px;padding:0 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:26px;display:block}
.brand span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border-left:1px solid var(--line2);padding-left:10px}
.company{display:flex;flex-direction:column;line-height:1.25;margin-left:6px}
.company b{font-size:14px}.company small{font-size:12px;color:var(--muted)}
.persona{margin-left:auto;display:flex;gap:4px;background:var(--ground);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;max-width:100%}
.persona button{border:none;background:none;border-radius:9px;padding:7px 12px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;white-space:nowrap}
.persona button b{font-size:13px}.persona button small{font-size:11px;color:var(--muted)}
.persona button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px rgba(35,31,32,.12)}
.persona button[aria-pressed="true"] b{color:var(--red)}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 100px)}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side .who{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.av{flex-shrink:0;width:38px;height:38px;border-radius:19px;background:var(--red-t);color:var(--red-d);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;align-items:center;gap:10px;border:none;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink)}
.side nav button:hover{background:var(--ground)}
.side nav button[aria-current="page"]{background:var(--red-t);color:var(--red-d)}
.side nav .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:9px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.main{padding:24px 28px 60px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(22px,2.4vw,28px);font-weight:800;margin-top:4px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:1px solid var(--line);padding:10px 12px}
  .side .who{display:none}
  .side nav{flex-direction:row;overflow-x:auto}
  .side nav button{white-space:nowrap}
  .main{padding:18px 16px 48px}
  .persona{margin-left:0;width:100%}
}

/* parts */
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:170px;background:var(--ink);color:#fff;display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,31,32,.85),rgba(35,31,32,.2) 75%)}
.hero > div{position:relative;z-index:1;padding:22px 24px;max-width:620px}
.limits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lim{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;background:#fff}
.lim b{font-size:15px}
.lim span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px}
button.item:hover{border-color:var(--ink)}
.item .t{display:flex;flex-direction:column;gap:3px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:28px 1fr;gap:10px;position:relative;padding-bottom:16px}
.tl:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl .dot{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line2);background:#fff;color:var(--muted)}
.tl.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.tl.now .dot{border-color:var(--amber);background:var(--amber-t);color:var(--amber)}
.tl.bad .dot{background:var(--red);border-color:var(--red);color:#fff}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.over{background:var(--red)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red);font-weight:800}
.opt{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.opt.sel{border:2px solid var(--green);background:#F3FAF6}
.opt.lock{background:#FAF8F7}
.opt.lock .nm{color:var(--muted)}
@media (max-width:640px){.opt{grid-template-columns:1fr auto}.opt .act{grid-column:1/-1}}
.lockmsg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--red-d)}
.letter{background:#fff;border:1px solid var(--line);border-radius:6px;padding:40px 44px;font-size:13.5px;max-width:760px;margin:0 auto;box-shadow:0 10px 30px rgba(35,31,32,.08)}
.letter h2{text-align:center;font-size:16px;letter-spacing:.04em;text-decoration:underline;margin-bottom:2px}
.letter .kv{display:grid;grid-template-columns:200px 12px 1fr;gap:6px 0;margin:18px 0}
.sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px;text-align:center;font-size:12.5px}
.sig{display:flex;flex-direction:column;gap:6px;align-items:center}
.stamp{min-height:54px;display:flex;align-items:center;justify-content:center}
.stamp span{border:2px solid var(--green);color:var(--green);border-radius:8px;padding:4px 10px;font-weight:800;font-size:11px;transform:rotate(-6deg);letter-spacing:.05em}
@media (max-width:640px){.letter{padding:24px 18px}.letter .kv{grid-template-columns:1fr;}.letter .kv span:nth-child(3n+2){display:none}.sigs{grid-template-columns:1fr}}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:24px;font-weight:800}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 120px;gap:10px;align-items:center;font-size:13.5px}
.bar .tr{height:14px;background:var(--ground);border-radius:0 4px 4px 0;position:relative}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:0 4px 4px 0}
.bar .tr i.alt{background:var(--red-d)}
@media (max-width:520px){.bar{grid-template-columns:90px 1fr 92px;font-size:12.5px}}
.cols{display:flex;align-items:flex-end;gap:18px;height:200px;padding:0 6px;border-bottom:1px solid var(--line2);position:relative}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.col i{display:block;width:100%;max-width:64px;background:#E7A7A4;border-radius:4px 4px 0 0}
.col.cur i{background:var(--red)}
.col span{font-size:12px;font-weight:700}
.collbl{display:flex;gap:18px;padding:6px 6px 0}
.collbl span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.invoice{background:#fff;border:1px solid var(--line);border-radius:6px;padding:36px 40px;max-width:860px;margin:0 auto;box-shadow:0 10px 30px rgba(35,31,32,.08)}
@media (max-width:640px){.invoice{padding:22px 16px}}
.inv-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:3px solid var(--red);padding-bottom:16px;margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;max-width:calc(100% - 32px)}
.empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.sum{display:flex;flex-direction:column;gap:8px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.flowstrip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;font-weight:700}
.flowstrip span{padding:6px 10px;border-radius:8px;background:var(--ground);border:1px solid var(--line)}
.flowstrip i{color:var(--muted);font-style:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function estimate(e,dest,from,to,needs){
  var p=pol(e),c=CITIES[dest],d=Math.max(1,days(from,to)),n=Math.max(0,d-1),r={};
  if(needs.indexOf('flight')>=0&&c.fare)r.flight=(p.flight==='Business'?Math.round(c.fare*2.6/1000)*1000:Math.round(c.fare*1.05/1000)*1000)*2;
  if(needs.indexOf('train')>=0&&c.train)r.train=c.train*2;
  if(needs.indexOf('hotel')>=0&&n)r.hotel=p.hotel*n;
  if(needs.indexOf('car')>=0)r.car=CAR_PRICE[p.car]*d;
  r.allowance=p.allowance*d;
  var t=0;for(var k in r)t+=r[k];r.total=t;r.days=d;r.nights=n;return r;
}

function formVals(){var needs=[].slice.call(document.querySelectorAll('#f-needs input:checked')).map(function(i){return i.value;});return {dest:val('f-dest'),from:val('f-from'),to:val('f-to'),purpose:val('f-purpose'),needs:needs};}
function recalc(){
  var el=document.getElementById('est');if(!el)return;var e=me(),f=formVals(),c=CITIES[f.dest];
  document.querySelectorAll('#f-needs .ck').forEach(function(l){var n=l.dataset.need,off=(n==='flight'&&!c.fare)||(n==='train'&&!c.train);l.classList.toggle('off',off);var i=l.querySelector('input');i.disabled=off;if(off)i.checked=false;});
  f=formVals();

function vPlan(s,e){

  '<div style="margin-top:22px;background:var(--ground);border-radius:12px;padding:14px;font-size:13px"><b>How to pay</b><div class="muted">Transfer to BCA Virtual Account <b class="num" style="color:var(--ink)">8808 7712 0026 1009</b> before '+fmtD(i.due)+'. The payment is matched automatically.</div></div></div>';
}

/* ---------- events ---------- */
function val(id){var e=document.getElementById(id);return e?e.value:null;}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('button,[data-view]');if(!el||el.disabled)return;var d=el.dataset;
  if(d.persona){UI.persona=d.persona;UI.view=PERSONAS[d.persona].home;UI.letter=false;render();window.scrollTo(0,0);return;}
  if(d.view){UI.letter=false;go(d.view);return;}
  if(d.sppd){UI.sppd=d.sppd;UI.tab=null;UI.letter=false;go('sppd');return;}
  if(d.tab){UI.tab=d.tab;render();return;}
  if(d.pick){var a=d.pick.split('|'),cart=S.plan[UI.sppd]=S.plan[UI.sppd]||{};cart[a[0]]={id:a[1],price:+a[2],desc:decodeURIComponent(a[3])};
    var s=sp(UI.sppd),next=s.needs.filter(function(k){return !cart[k];})[0];if(next)UI.tab=next;save();render();return;}
  if(d.approve||d.reject){var id=d.approve||d.reject,s=sp(id),note=val('note-'+id)||'';
    if(d.reject){s.log.push(['rejected',me().id,iso(TODAY),note]);s.status='rejected';toast('Request rejected. '+emp(s.emp).name+' is notified.');}
    else{s.log.push(['approved',me().id,iso(TODAY),note]);
      var needFin=UI.persona==='mgr'&&s.est>S.rules.financeOver;
      if(needFin){s.status='pending_fin';toast('Approved. Sent to Finance because it is above '+rp(S.rules.financeOver)+'.');}
      else{s.status='approved';s.no=String(S.seq++).padStart(3,'0')+'/SPPD/NTI/X/2026';toast('Approved. '+s.no+' issued, '+emp(s.emp).name+' can now plan the trip.');}}
    save();render();return;}
  if(d.inv){UI.inv=d.inv;go('invoice');return;}
  if(d.pay){var iv=S.invoices.filter(function(x){return x.id===d.pay;})[0];iv.status='paid';save();toast(iv.id+' marked as paid (simulated VA payment)');render();return;}
  var a=d.act;if(!a)return;
  if(a==='toast'){toast(d.msg);return;}
  if(a==='letter'){UI.letter=true;render();window.scrollTo(0,0);return;}
  if(a==='unletter'){UI.letter=false;render();return;}
  if(a==='book'){var s2=sp(UI.sppd),cart2=S.plan[UI.sppd]||{},e2=emp(s2.emp);Object.keys(cart2).forEach(function(k,i){S.bookings.push({id:'B'+Date.now()+i,sppd:s2.id,cat:k,desc:cart2[k].desc,amount:cart2[k].price,inPolicy:true,inv:null});});
    s2.status='booked';delete S.plan[UI.sppd];save();toast('Booked. Tickets and vouchers are sent to '+e2.name+'. Charged to the company account.');render();return;}
  if(a==='gen'){var inv=generate();if(inv){toast(inv.id+' generated and sent to PT Nusantara Trading Indonesia');UI.inv=inv.id;go('invoice');}return;}
  if(a==='reset'){S=seed();save();UI.view=PERSONAS[UI.persona].home;toast('Demo data reset');render();return;}
});
document.addEventListener('input',function(ev){if(ev.target.closest('#sppdForm'))recalc();});
document.addEventListener('change',function(ev){var t=ev.target,d=t.dataset;
  if(t.closest('#sppdForm')){recalc();return;}
  if(d.grade){emp(d.grade).grade=t.value;save();toast(emp(d.grade).name+' is now '+t.value+'. New limits apply.');return;}
  if(d.appr!=null&&t.matches('[data-appr]')){emp(d.appr).appr=t.value||null;save();toast('Approver updated');return;}
  if(d.pol){var a=d.pol.split('|');S.policy[a[0]][a[1]]=a[1]==='hotel'||a[1]==='allowance'?+t.value:t.value;save();toast(a[0]+' policy updated');return;}
  if(d.rule){S.rules[d.rule]=+t.value;save();toast('Approval rule updated');return;}
});
document.addEventListener('submit',function(ev){var f=ev.target,k=f.dataset.form;if(!k)return;ev.preventDefault();
  if(k==='sppd'){var e=me(),v=formVals();if(!v.purpose.trim()){toast('Add the purpose of the trip');return;}if(v.to<v.from){toast('The return date is before the departure date');return;}if(!v.needs.length){toast('Choose at least one item');return;}
    var r=estimate(e,v.dest,v.from,v.to,v.needs),id='S'+Date.now();
    var s={id:id,no:null,emp:e.id,dest:v.dest,from:v.from,to:v.to,purpose:v.purpose.trim(),needs:v.needs,status:e.appr?'pending_mgr':'pending_fin',est:r.total,log:[['submitted',e.id,iso(TODAY)]]};
    S.sppd.push(s);save();toast('Submitted. '+(e.appr?emp(e.appr).name:'Finance')+' is notified on WhatsApp and in the app.');UI.sppd=id;go('sppd');}
  if(k==='invite'){var n=val('i-name').trim();S.emps.push({id:'E'+Date.now(),name:n,title:val('i-title').trim(),grade:val('i-grade'),dept:val('i-dept'),cc:{Sales:'SLS-JKT',Operations:'OPS-SBY',Finance:'FIN-HO',IT:'IT-HO'}[val('i-dept')],appr:'E7'});save();toast('Invite sent to '+n);render();}
});
render();
})();
</script>
