<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<title>kitawisata Live Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --red:#CC2423; --red-d:#9A1B1B; --red-t:#FBE9E8; --gold:#F2B632;
  --ink:#231F20; --muted:#6B5F5C; --line:#E8E2E0; --line2:#D6CECB;
  --ground:#F8F6F5; --white:#FFFFFF; --green:#1C7C54; --green-d:#155E40; --green-t:#E3F2EA;
  --amber:#7A5200; --amber-t:#FDF3DC;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red-d)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;border:none;font-weight:700;font-size:15px;text-decoration:none;transition:background .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-d)}
.btn-line{background:#fff;color:var(--ink);border:1px solid var(--line2)}.btn-line:hover{border-color:var(--ink)}
.btn-ghost-w{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.b-green{background:var(--green-t);color:var(--green-d)}.b-amber{background:var(--amber-t);color:var(--amber)}
.b-red{background:var(--red-t);color:var(--red-d)}.b-grey{background:#EFEAE8;color:var(--muted)}.b-ink{background:var(--ink);color:#fff}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{height:50px;border:1px solid var(--line2);border-radius:12px;padding:0 14px;font-size:16px;font-weight:600;color:var(--ink);background:#FCFBFA;text-transform:none;letter-spacing:0;width:100%}
.field textarea{height:auto;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px var(--red-t)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:72px}
.logo{display:flex;align-items:center;border:none;background:none;padding:6px 0}
.logo img{height:30px;width:auto;display:block}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:none;background:none;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14.5px;white-space:nowrap;color:var(--ink)}
.nav button:hover{background:var(--ground)}
.nav button[aria-current="page"]{color:var(--red)}
.top-right{display:flex;gap:10px;align-items:center}
.trips-pill{position:relative}
.dot{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
@media (max-width:860px){
  .top .wrap{flex-wrap:wrap;height:auto;padding-block:10px;gap:8px}
  .nav{order:3;flex-basis:100%}
  .top-right .login{display:none}
}

/* hero */
.hero{background:var(--red);color:#fff;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;padding-block:56px 130px}
.hero h1{font-size:clamp(32px,4.4vw,52px);line-height:1.1;font-weight:800;letter-spacing:-.01em}
.hero p{font-size:18px;max-width:540px;margin:16px 0 0}
.hero .eyebrow{color:#FFE9A8}
.hero-art{width:100%;max-width:560px;justify-self:end}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-block:36px 120px}.hero-art{display:none}}

.search{position:relative;margin-top:-96px;z-index:2;background:#fff;border-radius:18px;box-shadow:0 18px 40px rgba(35,31,32,.14);padding:8px 24px 22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 14px;border:none;border-bottom:3px solid transparent;background:none;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red);font-weight:800}
.sform{display:grid;gap:12px;align-items:end;margin-top:18px}
.sform.trip{grid-template-columns:1.4fr 1fr .8fr auto}
.sform.flight{grid-template-columns:1fr 1fr 1fr .7fr auto}
.sform.hotel{grid-template-columns:1.4fr 1fr .7fr .7fr auto}
@media (max-width:860px){.sform.trip,.sform.flight,.sform.hotel{grid-template-columns:1fr 1fr}.sform .btn{grid-column:1/-1}}
@media (max-width:480px){.sform.trip,.sform.flight,.sform.hotel{grid-template-columns:1fr}}
.hint{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:14px;font-size:14px;color:var(--muted)}
.hint span{display:flex;align-items:center;gap:8px}
.hint i{width:8px;height:8px;border-radius:4px;display:inline-block}

.strip{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;padding-block:28px}
.pays{display:flex;flex-wrap:wrap;gap:8px}
.pays span{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;font-weight:700}

section.block{padding-block:48px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2{font-size:clamp(26px,3vw,34px);font-weight:800;line-height:1.2;margin-top:8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.rule{padding:26px;display:flex;flex-direction:column;gap:16px}
.rule h3{font-size:20px;font-weight:800}
.sched{border-top:1px solid var(--line)}
.sched div{display:grid;grid-template-columns:130px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
@media (max-width:480px){.sched div{grid-template-columns:1fr auto}.sched div span:nth-child(2){display:none}}
.checks{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:12px;align-items:flex-start}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.tcard{overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;transition:box-shadow .15s,transform .15s;cursor:pointer;color:inherit}
.tcard:hover{box-shadow:0 12px 28px rgba(35,31,32,.10);transform:translateY(-2px)}
.tcard img{display:block;width:100%;height:180px;object-fit:cover;transition:transform .4s}
.tcard:hover img{transform:scale(1.04)}
.tcard .ph{overflow:hidden;position:relative}
.tcard .ph .badge{position:absolute;left:12px;top:12px}
.tcard .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tcard .name{font-size:17px;font-weight:700;line-height:1.3}
.tcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.price{font-size:18px;font-weight:800;color:var(--red)}

.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.svc button{display:flex;flex-direction:column;gap:10px;padding:20px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px}
.svc button:hover{border-color:var(--red)}
.svc b{font-size:16px}.svc small{font-size:13px;color:var(--muted)}

.biz{background:var(--ink);color:#fff;border-radius:22px;padding:44px 48px;display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center}
.biz h2{font-size:clamp(24px,2.6vw,32px);line-height:1.2;font-weight:800;margin:14px 0}
.biz .feats{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;color:#E7DEDC;font-size:15px}
@media (max-width:860px){.biz{grid-template-columns:1fr;padding:28px 22px}.biz .feats{grid-template-columns:1fr}}
.invoice{background:#fff;color:var(--ink);border-radius:16px;padding:22px 24px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:none}

.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.step{display:flex;gap:14px}
.step .n{flex-shrink:0;width:42px;height:42px;border-radius:21px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}

footer.site{background:var(--ink);color:#CFC6C4;margin-top:56px;padding-block:44px 28px}
footer.site .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px}
@media (max-width:760px){footer.site .cols{grid-template-columns:1fr 1fr}}
footer.site b{color:#fff;display:block;margin-bottom:8px}
footer.site button{display:block;background:none;border:none;color:#CFC6C4;padding:4px 0;text-align:left;font-size:14px}
footer.site button:hover{color:#fff}
footer.site .legal{border-top:1px solid #3A3334;margin-top:28px;padding-top:16px;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* inner pages */
.page{padding-block:28px 20px}
.crumb{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:16px}
.crumb button{border:none;background:none;padding:0;color:var(--red-d);font-weight:700}
.list{display:flex;flex-direction:column;gap:12px}
.lrow{display:grid;grid-template-columns:140px 1fr auto;gap:16px;padding:14px;align-items:center;text-align:left;width:100%}
.lrow img{width:140px;height:100px;border-radius:10px;display:block;object-fit:cover}
@media (max-width:600px){.lrow{grid-template-columns:96px 1fr}.lrow img{width:96px;height:96px}.lrow .act{grid-column:1/-1;align-items:stretch!important}}
.layout{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.side{position:sticky;top:96px;padding:20px;display:flex;flex-direction:column;gap:14px}
.deps{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.dep{padding:12px 8px;border-radius:12px;border:1px solid var(--line2);background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.dep[aria-pressed="true"]{border:2px solid var(--red);background:var(--red-t)}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:12px;overflow:hidden;width:max-content}
.stepper button{width:46px;height:46px;border:none;background:#fff;font-size:20px;font-weight:700}
.stepper span{min-width:44px;text-align:center;font-weight:800}
.itin{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;font-size:15px}
.progress{display:flex;gap:6px;margin-bottom:22px}
.progress div{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.progress i{height:5px;border-radius:3px;background:var(--line)}
.progress .on{color:var(--red)}.progress .on i{background:var(--red)}
.opt{display:flex;flex-direction:column;width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:#fff;text-align:left}
.opt[aria-checked="true"]{border:2px solid var(--green);background:#F1F8F4}
.opt.full[aria-checked="true"]{border-color:var(--red);background:#FFF8F7}
.opt .top-l{display:flex;gap:12px;align-items:center;width:100%}
.radio{flex-shrink:0;width:20px;height:20px;border-radius:10px;border:2px solid #A89C99;background:#fff}
.opt[aria-checked="true"] .radio{border:6px solid var(--green)}
.opt.full[aria-checked="true"] .radio{border-color:var(--red)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.mini{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2);display:flex;flex-direction:column;gap:6px;font-size:14px}
.mini div{display:flex;justify-content:space-between;gap:10px}
.methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.method{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left}
.method[aria-checked="true"]{border:2px solid var(--ink)}
.method[aria-checked="true"] .radio{border:6px solid var(--ink)}
.timer{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--amber-t);color:var(--amber)}
.va{font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:.05em}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.tripcard{padding:18px;display:flex;flex-direction:column;gap:10px}
.due{background:var(--amber-t);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
.demo{background:var(--amber-t);color:var(--amber);font-size:13px;font-weight:600;text-align:center;padding:8px 16px}

/* photos and illustrations */
.hero{background:#231F20}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,31,32,.82) 0%,rgba(35,31,32,.55) 45%,rgba(35,31,32,.05) 80%)}
.hero .wrap{position:relative;z-index:1;grid-template-columns:1fr;padding-block:88px 170px}
.hero-copy{max-width:600px}
.hero-tag{position:absolute;right:20px;bottom:120px;z-index:1;font-size:12px;font-weight:700;color:#fff;background:rgba(35,31,32,.55);padding:6px 10px;border-radius:999px;display:flex;gap:6px;align-items:center}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-size:22px}
.hero-stats span{font-size:13px;color:#F3E6E4}
.dest{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:200px;gap:14px}
.dest button{position:relative;border:none;padding:0;border-radius:16px;overflow:hidden;text-align:left;color:#fff;background:#231F20}
.dest button img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.dest button:hover img{transform:scale(1.05)}
.dest button::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(20,15,15,.75) 100%)}
.dest .lbl{position:absolute;left:16px;bottom:14px;z-index:1;display:flex;flex-direction:column}
.dest .lbl b{font-size:19px}.dest .lbl span{font-size:13px;opacity:.9}
.dest .big{grid-column:span 2;grid-row:span 2}
.dest .big .lbl b{font-size:28px}
@media (max-width:860px){.dest{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:160px}}
.svc2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.svc2 button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.svc2 button:hover{border-color:var(--red)}
.svc2 img{width:100%;height:110px;object-fit:cover;display:block}
.svc2 .t{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.svc2 b{font-size:15px}.svc2 small{font-size:12.5px;color:var(--muted)}
.biz-visual{position:relative}
.biz-visual img{width:100%;height:260px;object-fit:cover;border-radius:16px;display:block}
.biz-visual .invoice{margin:-90px 0 0 28px;position:relative;box-shadow:0 14px 34px rgba(0,0,0,.25)}
@media (max-width:860px){.biz-visual .invoice{margin:-60px 12px 0}}
.banner{position:relative;border-radius:18px;overflow:hidden;height:200px;margin-bottom:18px;background:#231F20}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,31,32,.75),rgba(35,31,32,0) 70%)}
.banner div{position:absolute;left:28px;bottom:24px;z-index:1;color:#fff;max-width:520px}
.banner h1{font-size:clamp(24px,3vw,32px);font-weight:800}
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:150px 150px;gap:8px}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery img:first-child{grid-row:span 2}
@media (max-width:600px){.gallery{grid-template-columns:1fr;grid-template-rows:220px}.gallery img:not(:first-child){display:none}}
.illus{width:100%;max-width:220px;height:auto;display:block;margin-bottom:12px}
.steps3 .step{flex-direction:column;gap:10px}
.appsec{display:grid;grid-template-columns:1fr 360px;gap:40px;align-items:center;background:var(--red-t);border-radius:22px;padding:40px 48px;overflow:hidden}
@media (max-width:860px){.appsec{grid-template-columns:1fr;padding:28px 22px}}
.phone{width:300px;justify-self:center;background:#231F20;border-radius:40px;padding:12px;box-shadow:0 24px 50px rgba(35,31,32,.25)}
.phone .scr{background:var(--ground);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding-bottom:16px}
.phone .scr img{width:100%;height:150px;object-fit:cover;display:block}
.store{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 18px;border-radius:12px;background:var(--ink);color:#fff;border:none;font-weight:700}
@media (max-width:600px){.hero::after{background:rgba(35,31,32,.62)}.hero .wrap{padding-block:48px 150px}.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.hero-stats b{font-size:17px}.hero-stats span{font-size:11.5px}.hero-tag{display:none}}
.tcard .foot{flex-wrap:wrap;gap:6px}.tcard .price{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="demo">Live prototype · sample prices and dates · no real payment is taken</div>

function flightsFor(from,to,date,pax){

  return rows.map(function(r,i){var fare=base+r[4];return {id:'f'+i,carrier:r[0],dep:r[1],arr:r[2],dur:r[3],bag:r[5],fare:fare,tax:135000,pax:pax,from:from,to:to,date:date};}).sort(function(a,b){return a.fare-b.fare;});
}

    (qr?'<div class="center" style="padding:10px"><svg width="160" height="160" viewBox="0 0 21 21" role="img" aria-label="QR code placeholder">'+qrSvg()+'</svg><span class="note">Scan with any QRIS app or '+esc(o.method)+'</span></div>':
     card?'<div class="two" style="gap:12px"><label class="field">Card number<input id="cc" inputmode="numeric" placeholder="4111 1111 1111 1111"></label><label class="field">Expiry<input id="exp" placeholder="MM/YY"></label></div>':
     '<div><div class="note">'+esc(o.method)+' number</div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="va num">'+o.va+'</span><button class="btn btn-line" data-copy="'+o.va.replace(/ /g,'')+'">Copy number</button></div></div><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px" class="muted"><li>Open your mobile banking app and choose Virtual Account transfer.</li><li>Enter the number above and check the name shows kitawisata.</li><li>Confirm the amount and enter your PIN. We check it automatically.</li></ol>')+
    '<div style="background:var(--ground);border:1px dashed var(--line2);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="note">Prototype: pretend the gateway confirmed your payment.</span><button class="btn btn-red" data-act="coPaid">Simulate payment received</button></div><button class="btn btn-line" data-act="coBack" style="align-self:flex-start">Change payment method</button></div>';
  } else {
    var b=state.bookings[0],paid=b.schedules.filter(function(s){return s.paid;}).reduce(function(a,s){return a+s.amount;},0),left=b.schedules.filter(function(s){return !s.paid;});
    body='<div class="card" style="padding:28px;display:flex;flex-direction:column;gap:18px"><div class="center">'+SUCCESS+'<h2 style="font-size:24px">'+(left.length?'Your seats are locked':(b.type==='trip'?'Fully paid, e-voucher issued':(b.type==='hotel'?'Voucher issued':'E-ticket issued')))+'</h2><p class="muted" style="margin:0;max-width:440px">We received '+rp(paid)+'. A confirmation is on its way to WhatsApp and email.</p></div>'+
    '<div class="row"><span class="muted">Booking code</span><b style="letter-spacing:.04em">'+b.code+'</b></div>'+
    (left.length?'<div class="bar"><i style="width:'+Math.round(paid/b.total*100)+'%"></i></div><div class="row num"><span class="muted">'+Math.round(paid/b.total*100)+'% paid</span><span>'+rp(paid)+' of '+rp(b.total)+'</span></div><b>Remaining payments</b>'+left.map(function(s){return '<div class="row num"><span>'+fmtD(s.due)+' · '+s.pct+'%</span><b>'+rp(s.amount)+'</b></div>';}).join(''):'')+
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-red" data-go="mytrips">View My Trips</button><button class="btn btn-line" data-go="home">Back to home</button></div></div>';
  }
  return '<div class="wrap page">'+crumb('Checkout')+head+'<div class="layout"><div>'+body+'</div>'+summary+'</div></div>';
}
function payToday(o){if(o.payIdx!=null)return o.booking.schedules[o.payIdx].amount;return o.plan==='split'&&o.schedule?o.schedule[0].amount:o.total;}
function qrSvg(){var r='<rect width="21" height="21" fill="#fff"/>';[[0,0],[14,0],[0,14]].forEach(function(p){r+='<rect x="'+p[0]+'" y="'+p[1]+'" width="7" height="7" fill="#231F20"/><rect x="'+(p[0]+1)+'" y="'+(p[1]+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(p[0]+2)+'" y="'+(p[1]+2)+'" width="3" height="3" fill="#231F20"/>';});[[9,1],[9,5],[8,9],[12,9],[17,9],[1,9],[10,14],[14,14],[18,17],[9,18],[15,19],[11,11],[16,12]].forEach(function(p){r+='<rect x="'+p[0]+'" y="'+p[1]+'" width="2" height="2" fill="#231F20"/>';});return r;}

/* ---------- my trips ---------- */
function vMyTrips(){
  var bs=state.bookings;
  return '<div class="wrap page">'+crumb('My Trips')+'<div class="sec-head"><div><div class="eyebrow">My Trips</div><h2>Your bookings and payments</h2></div>'+(bs.length?'<button class="btn btn-line" data-act="clear">Clear demo bookings</button>':'')+'</div>'+
  (bs.length?'<div class="grid-cards" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">'+bs.map(function(b,bi){
    var paid=b.schedules.filter(function(s){return s.paid;}).reduce(function(a,s){return a+s.amount;},0),next=b.schedules.filter(function(s){return !s.paid;})[0],pct=Math.round(paid/b.total*100);
    var badge=next?'<span class="badge b-green">Seat locked</span>':'<span class="badge b-ink">'+(b.type==='trip'||b.type==='hotel'?'Voucher ready':'E-ticket ready')+'</span>';
    return '<div class="card tripcard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b style="font-size:16px">'+esc(b.title)+'</b>'+badge+'</div><span class="note">'+esc(b.sub)+' · '+b.code+'</span>'+
    (b.schedules.length>1?'<div class="bar"><i style="width:'+pct+'%"></i></div><div style="display:flex;justify-content:space-between;font-size:13px" class="muted num"><span>'+pct+'% paid</span><span>'+rp(paid)+' of '+rp(b.total)+'</span></div>':'<span style="font-size:13px;font-weight:700;color:var(--red-d)">Paid in full · '+rp(b.total)+'</span>')+
    (next?'<div class="due"><div><div style="font-size:12px;font-weight:700;color:var(--amber)">Next payment · due '+fmtD(next.due)+'</div><b class="num" style="font-size:17px">'+rp(next.amount)+'</b></div><button class="btn btn-red" data-paynext="'+bi+'">Pay now</button></div>':'')+'</div>';
  }).join('')+'</div>':'<div class="card empty">'+SUITCASE+'<b style="font-size:18px">No trips yet</b><span class="muted">Book an open trip to see the split payment schedule here.</span><button class="btn btn-red" data-go="trips">Browse open trips</button></div>')+'</div>';
}

/* ---------- routing ---------- */
var app=document.getElementById('app');
function go(v){state.view=v;render();window.scrollTo(0,0);}
function render(){
  var v=state.view,h='';
  if(v==='home')h=vHome();else if(v==='trips')h=vTrips();else if(v==='trip')h=vTrip();else if(v==='flights')h=vFlights(false);else if(v==='trains')h=vFlights(true);else if(v==='hotels')h=vHotels();else if(v==='business')h=vBusiness();else if(v==='checkout')h=vCheckout();else if(v==='mytrips')h=vMyTrips();
  app.innerHTML=h;
  document.querySelectorAll('.nav button').forEach(function(b){var g=b.getAttribute('data-go');if(g===v||(v==='trip'&&g==='trips'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  var open=state.bookings.filter(function(b){return b.schedules.some(function(s){return !s.paid;});}).length,tc=document.getElementById('tripCount');
  tc.textContent=state.bookings.length;tc.hidden=!state.bookings.length;
  tick();
  photoSlots();
}
var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},2800);}
function tick(){var el=document.getElementById('hold');if(!el||!state.co)return;var ms=Math.max(0,state.co.holdUntil-Date.now()),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);el.lastChild.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s+' held';}
setInterval(tick,1000);
function code(){return 'KW-'+Date.now().toString().slice(-6)+'-'+Math.floor(1000+Math.random()*9000);}
function va(){var s='8808';for(var i=0;i<12;i++)s+=Math.floor(Math.random()*10);return s.replace(/(\d{4})(?=\d)/g,'$1 ');}
function val(id){var e=document.getElementById(id);return e?e.value:null;}

document.addEventListener('click',function(e){
  var el=e.target.closest('button,[data-go]');if(!el)return;
  var d=el.dataset;
  if(d.go){go(d.go);return;}
  if(d.tab){state.tab=d.tab;render();return;}
  if(d.cat){state.cat=d.cat;render();return;}
  if(d.trip){state.trip=TRIPS.filter(function(t){return t.id===d.trip;})[0];state.depIdx=0;state.pax=state.search.pax||2;go('trip');return;}
  if(d.city){state.search.city=d.city;go('hotels');return;}
  if(d.dep){state.depIdx=+d.dep;render();return;}
  if(d.pax){var t=state.trip,left=t.deps[state.depIdx][1];state.pax=Math.max(1,Math.min(left,state.pax+ +d.pax));if(state.pax===left&&+d.pax>0)toast('Only '+left+' seats left on this departure');render();return;}
  if(d.plan){if(el.disabled)return;state.co.plan=d.plan;render();return;}
  if(d.method){state.co.method=d.method;render();return;}
  if(d.copy){var txt=d.copy;if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('Copied');},function(){toast(txt);});}else toast(txt);return;}
  if(d.fl!=null){var s=state.search,train=d.kind==='train',rows=flightsFor(train?s.tfrom:s.from,train?s.tto:s.to,s.fdate,s.fpax||1);var r=rows[+d.fl];if(train){r.carrier=['Executive','Business','Economy','Executive'][+d.fl];r.fare=Math.round(r.fare*.38/1000)*1000;r.tax=0;}
    var fp=s.fpax||1;startCheckout({type:train?'train':'flight',title:(train?s.tfrom+' to '+s.tto:s.from.split(' (')[0]+' to '+s.to.split(' (')[0]),sub:fmtDs(new Date(s.fdate))+' · '+r.dep+' to '+r.arr+' · '+r.carrier,pax:fp,total:(r.fare+r.tax)*fp,lines:[['Fare × '+fp,r.fare*fp]].concat(r.tax?[['Taxes and fees',r.tax*fp]]:[]),schedule:null});return;}
  if(d.ht!=null){var h=HOTELS[+d.ht],s2=state.search;startCheckout({type:'hotel',title:h[0],sub:s2.city+' · '+fmtDs(new Date(s2.fdate))+' · '+s2.nights+' night'+(s2.nights>1?'s':''),pax:1,total:h[2]*s2.nights,lines:[[rp(h[2])+' × '+s2.nights+' night'+(s2.nights>1?'s':''),h[2]*s2.nights]],schedule:null});return;}
  if(d.paynext!=null){var b=state.bookings[+d.paynext],idx=b.schedules.findIndex(function(x){return !x.paid;});state.co={type:b.type,title:b.title,sub:b.sub,total:b.total,lines:[['Payment '+(idx+1)+' of '+b.schedules.length,b.schedules[idx].amount]],plan:'split',method:'BCA Virtual Account',holdUntil:Date.now()+24*3600000,step:3,va:va(),booking:b,payIdx:idx,schedule:b.schedules};go('checkout');return;}
  var a=d.act;if(!a)return;
  if(a==='toast'){toast(d.msg);return;}
  if(a==='login'){toast('Log in with phone OTP happens in the app (prototype)');return;}
  if(a==='bookTrip'){var t2=state.trip,dep=depDate(t2,state.depIdx),total=t2.price*state.pax;startCheckout({type:'trip',title:t2.name,sub:fmtD(dep)+' · '+state.pax+' traveller'+(state.pax>1?'s':''),pax:state.pax,total:total,lines:[[rp(t2.price)+' × '+state.pax,total]],schedule:splitPlan(total,dep)});return;}
  if(a==='coBack'){state.co.step=Math.max(1,state.co.step-1);if(state.co.payIdx!=null){go('mytrips');return;}render();return;}
  if(a==='coPay'){state.co.va=va();state.co.step=3;render();window.scrollTo(0,0);return;}
  if(a==='coPaid'){var o=state.co;
    if(o.payIdx!=null){o.booking.schedules[o.payIdx].paid=true;state.bookings.splice(state.bookings.indexOf(o.booking),1);state.bookings.unshift(o.booking);}
    else{var sch=(o.type==='trip'&&o.plan==='split'&&o.schedule)?o.schedule.map(function(x,i){return {pct:x.pct,due:x.due,amount:x.amount,paid:i===0};}):[{pct:100,due:TODAY,amount:o.total,paid:true}];
      state.bookings.unshift({code:code(),type:o.type,title:o.title,sub:o.sub,total:o.total,schedules:sch});}
    save();o.step=4;render();window.scrollTo(0,0);return;}
  if(a==='reFlight'){state.search.from=val('s-from');state.search.to=val('s-to');state.search.fdate=val('s-date')||state.search.fdate;render();return;}
  if(a==='reTrain'){state.search.tfrom=val('s-tfrom');state.search.tto=val('s-tto');state.search.fdate=val('s-date')||state.search.fdate;render();return;}
  if(a==='reHotel'){state.search.city=val('s-city');state.search.fdate=val('s-in')||state.search.fdate;state.search.nights=+val('s-nights');render();return;}
  if(a==='clear'){state.bookings=[];save();render();return;}
});
document.addEventListener('submit',function(e){
  var f=e.target,k=f.getAttribute('data-form');if(!k)return;e.preventDefault();
  var s=state.search;
  if(k==='trip'){s.dest=val('s-dest');s.pax=+val('s-pax');state.cat=val('s-cat');var q=(s.dest||'').toLowerCase();var hit=TRIPS.filter(function(t){return q&&(t.place.toLowerCase().indexOf(q.split(',')[0])>=0||t.name.toLowerCase().indexOf(q.split(',')[0])>=0);})[0];
    if(hit&&state.cat==='all'){state.trip=hit;state.depIdx=0;state.pax=s.pax;go('trip');}else go('trips');}
  if(k==='flight'){s.from=val('s-from');s.to=val('s-to');s.fdate=val('s-date')||s.fdate;s.fpax=+val('s-fpax');go('flights');}
  if(k==='train'){s.tfrom=val('s-tfrom');s.tto=val('s-tto');s.fdate=val('s-tdate')||s.fdate;s.fpax=+val('s-tpax');go('trains');}
  if(k==='hotel'){s.city=val('s-city');s.fdate=val('s-in')||s.fdate;s.nights=+val('s-nights');s.guests=+val('s-guests');go('hotels');}
  if(k==='trav'){var o=state.co;f.querySelectorAll('[data-name]').forEach(function(i){o.names[+i.dataset.name]=i.value;});o.step=2;render();window.scrollTo(0,0);}
  if(k==='biz'){toast('Thanks, '+val('b-name')+' is registered. We will email '+val('b-email')+' (prototype)');f.reset();}
});
render();
})();
</script>

</body></html>
